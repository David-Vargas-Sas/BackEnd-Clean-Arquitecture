name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: ventas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_password_only@localhost:5432/ventas_ci
      JWT_SECRET: ci-only-key-do-not-use-in-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-schema.js --check
      - run: node scripts/setup-db.js
      - run: node scripts/migrate-db.js
      - run: node scripts/verify-postgres.js
      - run: node scripts/verify-concurrency.js
